<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where the data comes from</title>
<link rel="stylesheet" href="../_studio/studio.css">
<script src="../_studio/data.js"></script>
<script src="../_studio/studio.js"></script>
<style>
:root {
  --bg: var(--st-bg); --panel: var(--st-panel); --ink: var(--st-ink); --muted: var(--st-muted); --line: var(--st-line);
  --accent: var(--st-accent); --warn: var(--st-open); --warn-bg: var(--st-open-soft);
  --source: #6b6b66; --bronze: #9c6b30; --silver: #6f7d8c; --gold: #b08d1a;
  --hard: #a33a2b; --soft: #7a6a2b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --source: #a09f98; --bronze: #d29a5a; --silver: #a9b6c4; --gold: #e0c04f;
    --hard: #e07a6b; --soft: #d8c27a;
  }
}
:root[data-theme="dark"] {
  --source: #a09f98; --bronze: #d29a5a; --silver: #a9b6c4; --gold: #e0c04f;
  --hard: #e07a6b; --soft: #d8c27a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 16px 12px; border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 20px; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
.chip b { color: var(--ink); font-weight: 600; }
main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 0; min-height: calc(100vh - 110px); }
nav { border-right: 1px solid var(--line); padding: 12px 16px; overflow-y: auto; }
nav input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; }
nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
nav details { margin: 4px 0; }
nav summary { cursor: pointer; font-weight: 600; padding: 2px 0; }
nav ul { list-style: none; margin: 4px 0 8px; padding: 0 0 0 12px; }
nav li a { display: block; padding: 2px 6px; border-radius: 4px; color: var(--ink); text-decoration: none; font-size: 13px; overflow-wrap: anywhere; }
nav li a:hover { background: var(--line); }
nav li a.on { background: var(--accent); color: var(--panel); }
section#view { padding: 16px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0 0 8px; }
.card.source { border-left-color: var(--source); } .card.bronze { border-left-color: var(--bronze); }
.card.silver { border-left-color: var(--silver); } .card.gold { border-left-color: var(--gold); }
.card.rule { border-left-color: var(--accent); } .card.report { border-left-color: var(--ink); }
.card h3 { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.card .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.card .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.card code { font-size: 12px; background: var(--bg); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
.up { margin-left: 18px; padding-left: 12px; border-left: 1px dashed var(--line); }
.rel { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
.q { font-size: 12px; margin-top: 4px; }
.t { font-size: 12px; margin-top: 4px; }
.t span { font-weight: 600; }
.card .gap { margin: 6px 0 0; }
.q .hard { color: var(--hard); font-weight: 600; } .q .soft { color: var(--soft); font-weight: 600; }
.gap { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 6px 10px; font-size: 13px; margin: 0 0 8px; }
.empty { color: var(--muted); padding: 24px 0; }
ul.edge { margin: 4px 0 0; padding-left: 18px; font-size: 12px; color: var(--muted); }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
  .up { margin-left: 8px; padding-left: 8px; }
}
</style>
</head>
<body>
<header>
  <h1>Where the data comes from</h1>
  <p id="sub"></p>
  <div class="strip" id="strip"></div>
</header>
<main>
  <nav>
    <input id="filter" type="search" placeholder="Filter fields" aria-label="Filter fields">
    <div id="tree"></div>
  </nav>
  <section id="view"></section>
</main>
<div class="studio-page" style="max-width: none; padding-top: 8px;"><div id="studio-open"></div></div>
<script src="data.js"></script>
<script>
(function () {
  const D = window.__LINEAGE__ || {};
  const index = (list) => Object.fromEntries((list || []).map((x) => [x.id, x]));
  const fields = index(D.fields), datasets = index(D.datasets), rules = index(D.rules);
  const columns = index(D.columns), tables = index(D.tables);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const builders = {}, outputTests = {};
  for (const x of [...(D.outputs || []), ...(D.entities || [])]) if (x.dataset && x.built_by) builders[x.dataset] = x.built_by;
  for (const o of D.outputs || []) if (o.dataset) outputTests[o.dataset] = o.tests || [];
  const guards = {};
  for (const q of D.quality || []) for (const t of q.targets || []) (guards[t] = guards[t] || []).push(q);

  // header
  const served = new Set((D.outputs || []).map((o) => o.product));
  const products = (D.products || []).filter((p) => served.has(p.id)).map((p) => p.label).join(', ');
  const mode = D.mode || {};
  document.getElementById('sub').textContent =
    (products ? products + ' · ' : '') + 'read from the knowledge base' + (mode.preview_built_at ? ', preview built ' + mode.preview_built_at : '');
  const byLayer = (l) => (D.datasets || []).filter((d) => d.layer === l).length;
  const gates = [1, 2, 3].map((g) => (D.quality || []).filter((q) => q.gate === g).length);
  document.getElementById('strip').innerHTML = [
    ['source tables', (D.tables || []).length], ['conformed datasets (silver)', byLayer('silver')], ['output datasets (gold)', byLayer('gold')],
    ['outputs', (D.outputs || []).length], ['calculation rules', (D.rules || []).length],
    ['quality checks', gates.reduce((a, b) => a + b, 0)],
  ].map(([k, v]) => '<span class="chip"><b>' + esc(v) + '</b> ' + esc(k) + '</span>').join('');

  // navigation: outputs (gold), then entities (silver), each with its dataset's fields
  function group(title, items) {
    const blocks = items.filter((x) => x.dataset && datasets[x.dataset]).map((x) => {
      const ids = (datasets[x.dataset].fields || []).filter((f) => fields[f]);
      const links = ids.map((f) => '<li><a href="#' + encodeURIComponent(f) + '" data-id="' + esc(f) + '">' +
        esc(short(fields[f].label)) + '</a></li>').join('');
      return '<details open><summary>' + esc(x.label) + '</summary><ul>' + links + '</ul></details>';
    }).join('');
    return blocks ? '<h2>' + esc(title) + '</h2>' + blocks : '';
  }
  const short = (label) => String(label).split('.').pop();
  const tree = document.getElementById('tree');
  tree.innerHTML = group('Outputs (gold)', D.outputs || []) + group('Conformed entities (silver)', D.entities || []) ||
    '<p class="empty">Nothing recorded yet: the outputs and entities appear here once the pipeline is designed.</p>';
  document.getElementById('filter').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    tree.querySelectorAll('li').forEach((li) => { li.hidden = term && !li.textContent.toLowerCase().includes(term); });
  });

  // one value's lineage, upstream
  function layerOf(fieldId) { const d = datasets[(fields[fieldId] || {}).dataset]; return d ? d.layer : ''; }
  // in words: where a check runs, and what happens when it fails; the rule's id and assertion stay in the explorer
  const ARRIVES = {1: 'on arrival in bronze', 2: 'on arrival in silver', 3: 'on arrival in gold'};
  const words = (t) => String(t || '').replace(/_/g, ' ');
  function guarded(...ids) {
    const seenQ = new Set();
    const qs = ids.flatMap((id) => guards[id] || []).filter((q) => !seenQ.has(q.id || q.label) && seenQ.add(q.id || q.label));
    return qs.length ? '<div class="q">' + qs.map((q) => '<span class="' + esc(q.severity) + '">' +
      (q.severity === 'hard' ? 'Stops the run' : 'Warns') + '</span> ' + esc(ARRIVES[q.gate] || 'when checked') + ': ' + esc(q.label) +
      ((q.report_checks || []).length ? ' · the report relies on it' : '')).join('<br>') + '</div>' : '';
  }
  function step(s) { return s ? ' · built by <b>' + esc(s.label) + '</b>' : ''; }
  // how the build plan proves it, in words; a missing test is said, never filled in
  const PROVES = {unit: 'Tested on its worked example', contract: 'Its promised shape is tested', parity: 'Compared with the figures it replaces',
    rerun: 'Run twice for the same period, same result', regression: 'Past periods stay as they were', integration: 'Tested with the real sources',
    forced_failure: 'A failure is made on purpose', flow: 'Tested in a whole run'};
  function proved(tests, needed, missing) {
    const lines = (tests || []).map((t) => '<span>' + esc(PROVES[t.kind] || 'Tested') + ':</span> ' + esc(t.label)).join('<br>');
    return (lines ? '<div class="t">' + lines + '</div>' : '') +
      (!(tests || []).some((t) => t.kind === needed) ? '<div class="gap">' + esc(missing) + '</div>' : '');
  }
  const LAYER = {gold: 'Output field (gold)', silver: 'Conformed field (silver)', bronze: 'Raw copy (bronze)'};
  function render(id, seen) {
    if (seen.has(id)) return '<div class="rel">(already shown above)</div>';
    seen = new Set(seen).add(id);
    if (fields[id]) {
      const f = fields[id], d = datasets[f.dataset] || {}, layer = d.layer || '';
      let html = '<div class="card ' + esc(layer) + '"><div class="kind">' + esc(LAYER[layer] || 'Field') + '</div><h3>' + esc(f.label) + '</h3>' +
        '<div class="meta">' + [f.term && 'means ' + f.term, f.required ? 'always filled' : null, d.label && 'in ' + d.label]
          .filter(Boolean).map(esc).join(' · ') + step(builders[f.dataset]) + '</div>' +
        (d.contract ? '<div class="meta">promised by ' + esc(d.contract.label) + (d.contract.version && !String(d.contract.label).includes(d.contract.version) ? ' v' + esc(d.contract.version) : '') + '</div>' : '') +
        guarded(id, f.dataset) +
        (outputTests[f.dataset] ? proved(outputTests[f.dataset], 'parity', 'Nothing compares this output yet with the figures it replaces.') : '') + '</div>';
      let up = '';
      if (f.derived_by) up += '<div class="rel">calculated by</div>' + render(f.derived_by, seen);
      for (const s of f.fed_by || []) up += '<div class="rel">copied from</div>' + render(s, seen);
      if (!up && layer !== 'bronze') up = '<div class="gap">Nobody has said where it comes from yet: neither calculated by a rule nor copied from a column or another field.</div>';
      return html + (up ? '<div class="up">' + up + '</div>' : '');
    }
    if (rules[id]) {
      const r = rules[id];
      const cases = (r.edge_cases || []).map((c) => '<li>' + esc(c.case) + ': ' + esc(c.behaviour) + '</li>').join('');
      let html = '<div class="card rule"><div class="kind">Calculation rule' + (r.kind ? ': ' + esc(words(r.kind)) : '') + '</div><h3>' + esc(r.label) + '</h3>' +
        (r.logic ? '<div class="meta">' + esc(r.logic) + '</div>' : '') +
        '<div class="meta">' + [words(r.period_dependency), r.examples ? (r.examples === 1 ? 'one worked example' : r.examples + ' worked examples') : null].filter(Boolean).map(esc).join(' · ') + step(r.built_by) + '</div>' +
        (cases ? '<ul class="edge">' + cases + '</ul>' : '') + proved(r.tests, 'unit', 'No test runs its worked example on the built pipeline yet.') + '</div>';
      if (!r.examples) html += '<div class="gap">No worked example yet: a person works one out to check the rule.</div>';
      const up = (r.inputs || []).map((i) => '<div class="rel">from</div>' + render(i, seen)).join('');
      return html + (up ? '<div class="up">' + up + '</div>' : '');
    }
    if (columns[id]) {
      const c = columns[id], t = tables[c.table] || {};
      const copy = t.copy || {};
      return '<div class="card source"><div class="kind">Source column</div><h3>' + esc(c.label) + '</h3>' +
        (c.term ? '<div class="meta">means ' + esc(c.term) + '</div>' : '') +
        (t.label ? '<div class="meta">in ' + esc(t.label) + (t.system ? ', from ' + esc(t.system) : '') +
          (t.change_behaviour ? ' · ' + esc(words(t.change_behaviour)) : '') + (copy.method ? ' · copied by ' + esc(words(copy.method)) : '') + step(copy.built_by) + '</div>' : '') +
        (c.term ? '' : '<div class="gap">Nobody has said what this column means in the business\'s words yet.</div>') + '</div>';
    }
    return '<div class="card"><div class="meta">Not recorded.</div></div>';
  }
  function show(id) {
    const view = document.getElementById('view');
    tree.querySelectorAll('a.on').forEach((a) => a.classList.remove('on'));
    const link = tree.querySelector('a[data-id="' + CSS.escape(id) + '"]');
    if (link) link.classList.add('on');
    if (!fields[id]) { view.innerHTML = '<p class="empty">Pick a field to see where its value comes from.</p>'; return; }
    const linked = (sid, text) => (window.Studio ? Studio.link(sid, text) : esc(text));
    const shown = (fields[id].report || []).flatMap((r) => (r.shown_as || []).map((s) =>
      '<div class="card report"><div class="kind">Shown in a report</div><h3>' + linked(s.id, s.label) + '</h3><div class="meta">' +
      (s.report ? 'in ' + esc(s.report) + ' · ' : '') + 'from the column ' + esc(r.column) + '</div></div>'));
    view.innerHTML = (shown.length ? shown.join('') + '<div class="rel">which reads</div>' : '') + render(id, new Set());
  }
  const first = tree.querySelector('a[data-id]');
  const pick = () => show(decodeURIComponent(location.hash.slice(1)) || (first && first.dataset.id) || '');
  window.addEventListener('hashchange', pick);
  pick();
})();
</script>
</body>
</html>
